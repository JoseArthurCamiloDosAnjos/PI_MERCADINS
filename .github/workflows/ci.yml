name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: Frontend

      - name: Typecheck
        run: npx tsc -b
        working-directory: Frontend

      - name: Lint
        run: npm run lint
        working-directory: Frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: Backend

      - name: Sintaxe (node --check)
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            node --check "$f" || fail=1
          done < <(find src scripts -name '*.js' -print0)
          exit $fail
        working-directory: Backend
