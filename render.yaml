services:
  - type: web
    name: mercadins-backend
    runtime: node
    plan: free
    buildCommand: cd Backend && npm install
    startCommand: cd Backend && node src/db/migrate.js && node src/server.js
    envVars:
      - key: FRONTEND_URL
        value: https://mercadins.com.br
      - key: ALLOWED_ORIGINS
        value: https://mercadins.com.br,https://www.mercadins.com.br
      - key: DB_PROVIDER
        value: neon
      - key: DATABASE_URL_NEON
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: Assas_API_KEY
        sync: false
      # Ambiente do Asaas no build publicado: "sandbox" deixa o site no ar
      # TESTANDO (chave e cobranças de teste). NÃO altere para "producao" sem
      # autorização explícita + credenciais Assas_API_KEY_Producao correspondentes.
      # O código NÃO infere produção por NODE_ENV/RENDER: sem esta variável o
      # default é sandbox (default seguro).
      - key: ASAAS_AMBIENTE
        value: sandbox
      - key: Assas_API_URL_Producao
        value: https://api.asaas.com/
      - key: Assas_API_URL_Sandbox
        value: https://api-sandbox.asaas.com/
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false

  - type: static_site
    name: mercadins-frontend
    runtime: static
    plan: free
    buildCommand: cd Frontend && npm install && npm run build
    staticPublishPath: ./Frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://pi-mercadins.onrender.com
