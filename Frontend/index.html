<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>Mercadins — Delivery de mercados perto de você</title>

    <!-- SEO -->
    <link rel="canonical" href="https://mercadins.com.br/" />
    <meta name="description" content="Mercadins: encontre e compre nos mercados, padarias, açougues e hortifrutis da sua região com entrega em casa. Peça pelo site e acompanhe seu pedido." />
    <meta name="keywords" content="delivery, mercados, supermercado, padaria, açougue, hortifruti, compras online, mercado perto de mim" />
    <meta name="author" content="Mercadins" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0d2858" />

    <!-- Open Graph (prévia ao compartilhar em redes sociais) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mercadins" />
    <meta property="og:title" content="Mercadins — Delivery de mercados perto de você" />
    <meta property="og:description" content="Encontre e compre nos mercados da sua região com entrega em casa. Peça pelo site e acompanhe seu pedido." />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://mercadins.com.br/" />
    <meta property="og:image" content="https://mercadins.com.br/pwa-512x512.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Mercadins — Delivery de mercados perto de você" />
    <meta name="twitter:description" content="Encontre e compre nos mercados da sua região com entrega em casa." />
    <meta name="twitter:image" content="https://mercadins.com.br/pwa-512x512.png" />

    <!-- Dados estruturados: ajuda o Google a entender o site (busca local) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Mercadins",
        "url": "https://mercadins.com.br/",
        "description": "Delivery de mercados, padarias, açougues e hortifrutis da sua região.",
        "inLanguage": "pt-BR",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://mercadins.com.br/?busca={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
